# Checks every migration on a fresh Supabase database, then applies new
# migrations to the real database once they reach main (decision 0009).
name: Database

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Which database to apply migrations to
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: false # never cut a migration off half way

permissions:
  contents: read

env:
  SUPABASE_CLI_VERSION: 2.120.0

jobs:
  check:
    name: Database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Start a fresh database and apply every migration
        run: supabase db start

      - name: Lint the database
        run: supabase db lint --local --level warning --fail-on warning

      - name: Database security tests (pgTAP)
        run: supabase test db

      - name: TypeScript types match the database
        run: |
          supabase gen types typescript --local --schema public > lib/database.types.ts
          if ! git diff --exit-code lib/database.types.ts; then
            echo "::error::lib/database.types.ts is out of date. Run: pnpm dlx supabase gen types typescript --local --schema public > lib/database.types.ts"
            echo "----- generated file -----"
            cat lib/database.types.ts
            exit 1
          fi

      - name: The public role can reach the health check
        run: |
          answer=$(psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -qtA -c "set role anon; select public.health();")
          test "$answer" = "ok"

  login:
    name: Login flow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Start Supabase (database, login, API, test mailbox)
        run: supabase start -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Read local Supabase settings
        run: |
          supabase status -o env > supabase.env
          set -a; . ./supabase.env; set +a
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}" >> "$GITHUB_ENV"
          echo "MAILPIT_URL=${MAILPIT_URL:-${INBUCKET_URL:-http://127.0.0.1:54324}}" >> "$GITHUB_ENV"
          echo "DB_URL=$DB_URL" >> "$GITHUB_ENV"
          rm supabase.env

      - name: Install packages
        run: pnpm install --frozen-lockfile

      - name: Build against local Supabase
        run: pnpm build

      - name: Install browser for tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Log in, log out, second factor, directory with real data
        run: |
          set -o pipefail
          pnpm exec playwright test -c playwright.auth.config.ts 2>&1 | tee login-flow.log
          # The app must not log server errors during the flow either.
          if grep -nE "\[WebServer\].*(Error|⨯)" login-flow.log; then
            echo "::error::The app logged server errors during the login flow (see above)."
            exit 1
          fi

      - name: Keep the test report if they fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: login-flow-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Apply migrations
    needs: [check, login]
    # Only ever from main: a manual run on another branch must not apply
    # unreviewed migrations to a real database.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Choose the database
        id: target
        env:
          TARGET: ${{ github.event.inputs.target || 'staging' }}
          STAGING_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          STAGING_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
          PRODUCTION_REF: ${{ secrets.SUPABASE_PRODUCTION_PROJECT_REF }}
          PRODUCTION_PASSWORD: ${{ secrets.SUPABASE_PRODUCTION_DB_PASSWORD }}
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ "$TARGET" = "production" ]; then ref=$PRODUCTION_REF; pw=$PRODUCTION_PASSWORD
          else ref=$STAGING_REF; pw=$STAGING_PASSWORD; fi
          if [ -z "$ref" ] || [ -z "$pw" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "::warning::Supabase secrets for $TARGET are not set yet, so no migrations were applied. See docs/app-setup.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Show what will be applied
        if: steps.target.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ steps.target.outputs.target == 'production' && secrets.SUPABASE_PRODUCTION_DB_PASSWORD || secrets.SUPABASE_STAGING_DB_PASSWORD }}
        run: supabase db push --project-ref "${{ steps.target.outputs.ref }}" --password "$SUPABASE_DB_PASSWORD" --dry-run

      - name: Apply migrations
        if: steps.target.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ steps.target.outputs.target == 'production' && secrets.SUPABASE_PRODUCTION_DB_PASSWORD || secrets.SUPABASE_STAGING_DB_PASSWORD }}
        run: supabase db push --project-ref "${{ steps.target.outputs.ref }}" --password "$SUPABASE_DB_PASSWORD" --yes
